name: Mivon CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mivon-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-check:
    name: Patch checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace errors
        run: git diff --check

      - name: Setup Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy lint (non-blocking — debt lint lama)
        # Gate dilonggarkan (keputusan user): warning clippy lama tidak
        # menggagalkan CI, tapi tetap tampil sebagai anotasi di run summary.
        # Error kompilasi tetap menggagalkan job. Perbaikan lint lama dapat
        # dilakukan bertahap tanpa memblokir rilis.
        run: cargo clippy --workspace --all-targets

  tests:
    name: Workspace tests
    runs-on: ubuntu-latest
    needs: patch-check
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Unit and integration tests
        run: cargo test --workspace --all-targets

  area-detection:
    name: Change area detection
    runs-on: ubuntu-latest
    needs: patch-check
    outputs:
      parser: ${{ steps.filter.outputs.parser }}
      simulator: ${{ steps.filter.outputs.simulator }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
      installer: ${{ steps.filter.outputs.installer }}
      documentation: ${{ steps.filter.outputs.documentation }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed areas
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            parser:
              - 'crates/mivon-parser/**'
              - 'crates/mivon-core/**'
              - 'crates/mivon-ast/**'
            simulator:
              - 'crates/mivon-simulator/**'
              - 'crates/mivon-elaboration/**'
              - 'crates/mivon-ir/**'
            dependencies:
              - 'Cargo.toml'
              - 'Cargo.lock'
            installer:
              - 'install.sh'
              - 'crates/mivon-tools/**'
              - '.github/workflows/**'
            documentation:
              - '**/*.md'
              - '**/*.mdx'
              - 'README.md'
              - 'INSTALLATION.md'

      - name: Debug filter results
        run: |
          echo "Parser changes: ${{ steps.filter.outputs.parser }}"
          echo "Simulator changes: ${{ steps.filter.outputs.simulator }}"
          echo "Dependency changes: ${{ steps.filter.outputs.dependencies }}"
          echo "Installer changes: ${{ steps.filter.outputs.installer }}"
          echo "Documentation changes: ${{ steps.filter.outputs.documentation }}"

  parser-regression:
    name: Parser regression tests
    runs-on: ubuntu-latest
    needs: [patch-check, area-detection]
    if: needs.area-detection.outputs.parser == 'true'
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run parser regression tests
        run: |
          echo "Running parser-specific tests due to code changes in parser/lexer"
          cargo test -p mivon-lexer -p mivon-parser --test regression
          cargo test -p mivon-core --test debug_lexer

  simulator-regression:
    name: Simulator regression tests
    runs-on: ubuntu-latest
    needs: [patch-check, area-detection]
    if: needs.area-detection.outputs.simulator == 'true'
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run simulator regression tests
        run: |
          echo "Running simulator-specific tests due to code changes in simulator/elaboration"
          cargo test -p mivon-simulator --test regression
          cargo test -p mivon-tests --test tb_counter
          cargo test -p mivon-tests --test rtl_regression

  dependency-validation:
    name: Dependency validation
    runs-on: ubuntu-latest
    needs: [patch-check, area-detection]
    if: needs.area-detection.outputs.dependencies == 'true'
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Validate dependencies
        run: |
          echo "Validating dependency changes due to Cargo.toml/Cargo.lock updates"
          cargo update
          cargo check --workspace --all-targets
          cargo test -p mivon-tests -- --test-threads=1

  installer-validation:
    name: Installer validation
    runs-on: ubuntu-latest
    needs: [patch-check, area-detection]
    if: needs.area-detection.outputs.installer == 'true'
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Validate installer script
        run: |
          echo "Validating installer script changes"
          bash -n install.sh
          chmod +x install.sh
          ./install.sh --help 2>&1 || echo "Installer script validation completed"

      - name: Run installer tests
        run: |
          echo "Running installer integration tests"
          cargo test -p mivon-tools --test integration

  documentation-check:
    name: Documentation validation
    runs-on: ubuntu-latest
    needs: [patch-check, area-detection]
    if: needs.area-detection.outputs.documentation == 'true'
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Validate markdown links
        run: |
          echo "Running markdown documentation checks due to doc changes"
          if command -v markdownlint >/dev/null 2>&1; then
            markdownlint README.md GITHUB_ACTIONS.md
          else
            echo "markdownlint not installed, skipping link validation"
          fi

      - name: Validate installation documentation
        run: |
          echo "Validating installation documentation"
          if grep -q "Installation" README.md; then
            echo "✓ Installation section present in README.md"
          fi

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    needs: [
      patch-check,
      tests,
      parser-regression,
      simulator-regression,
      dependency-validation,
      installer-validation,
      documentation-check
    ]
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release binary
        run: |
          echo "Building release binary"
          cargo build --workspace --release
          mkdir -p artifacts
          cp target/release/mivon artifacts/

      - name: Verify binary
        run: |
          echo "Verifying release binary functionality"
          ./artifacts/mivon --help > verification.log 2>&1
          if [ $? -eq 0 ]; then
            echo "✓ Release binary verified successfully"
            cat verification.log | head -20
          else
            echo "✗ Release binary verification failed"
            cat verification.log
            exit 1
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mivon-release
          path: artifacts/
          retention-days: 90