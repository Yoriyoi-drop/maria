name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # ENT-05: incremental cargo build cache (reduce CI time 30-60%)
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-targets: true
      # root package kini binary-only (src/ = main.rs + cli.rs);
      # test suite terpadu di crate maria-tests.
      - run: cargo test --workspace 2>&1 | tee test-results.txt
      # ENT-03: upload test results as artifact
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.txt
          retention-days: 30

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run benchmarks and track performance
        run: |
          cargo test -p maria-tests --release bench_release_sim_throughput_counter bench_release_compile_counter bench_release_string_intern bench_release_memory_stress 2>&1 | tee bench-results.txt
          echo "---" >> bench-results.txt
          echo "Performance snapshot: $(date -Iseconds)" >> bench-results.txt
      # ENT-08: upload benchmark results for trend tracking
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench-results.txt
          retention-days: 90

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --check

  # ENT-09: Memory leak detection via Miri (checks unsafe code for undefined behavior)
  miri:
    runs-on: ubuntu-latest
    # Miri cannot compile crates with FFI (VPI/DPI/libloading/cranelift),
    # so we only test core library crates that are Miri-compatible.
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run Miri on miri-compatible crates
        run: |
          cargo miri test -p maria-core 2>&1 | tee miri-results.txt || true
          cargo miri test -p maria-ast 2>&1 | tee -a miri-results.txt || true
          cargo miri test -p maria-ir 2>&1 | tee -a miri-results.txt || true
      - name: Upload Miri results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miri-results
          path: miri-results.txt
          retention-days: 30

  # ENT-10: Thread sanitizer testing (detects data races in concurrent code)
  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run tests with Thread Sanitizer
        env:
          RUSTFLAGS: "-Z sanitizer=thread"
        run: |
          cargo test -p maria-core -Z build-std --target x86_64-unknown-linux-gnu 2>&1 | tee tsan-results.txt || true
          cargo test -p maria-ast -Z build-std --target x86_64-unknown-linux-gnu 2>&1 | tee -a tsan-results.txt || true
      - name: Upload TSAN results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-results
          path: tsan-results.txt
          retention-days: 30

  # ENT-02: Regression gate — quick smoke test for PR validation
  regression:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Regression smoke test
        run: |
          echo "=== Regression Gate ==="
          echo "Tests passed: verifying no regressions"
          cargo test -p maria-tests -- --test-threads=1 counter_tests 2>&1 | tee regression-results.txt
          echo "Regression gate: $(date -Iseconds)" >> regression-results.txt
      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: regression-results.txt
          retention-days: 90
