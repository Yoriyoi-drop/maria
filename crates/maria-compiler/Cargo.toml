[package]
name = "maria-compiler"
version = "0.3.0"
edition = "2021"
description = "Maria compiler pipeline: frontend, cache, MICD, HIR, MIR, profiling, scheduler (task cluster)"

[dependencies]
maria-core = { path = "../maria-core" }
maria-ast = { path = "../maria-ast" }
maria-ir = { path = "../maria-ir" }
maria-parser = { path = "../maria-parser" }
maria-elaboration = { path = "../maria-elaboration" }

# Compiler pipeline: parallel parse (rayon), thread-safe maps (dashmap),
# MICD binary serialization (bincode + lz4), mmap (memmap2), work-stealing (crossbeam)
bincode = "1.3"
crossbeam = "0.8"
dashmap = "6"
lz4_flex = { version = "0.11", default-features = false, features = ["frame"] }
memmap2 = "0.9"
num_cpus = "1"
parking_lot = "0.12"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Optional: Cranelift JIT (mir/jit.rs) — activated via feature "jit"
cranelift = { version = "0.110", optional = true }
cranelift-jit = { version = "0.110", optional = true }
cranelift-frontend = { version = "0.110", optional = true }
cranelift-module = { version = "0.110", optional = true }

[features]
jit = ["cranelift", "cranelift-jit", "cranelift-frontend", "cranelift-module"]

[dev-dependencies]
tempfile = "3"
