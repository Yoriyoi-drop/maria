[package]
name = "mivon-fuzz"
version = "0.1.0"
edition = "2021"
description = "mivon fuzzer internal (dev-only) — bukan CLI user. Landasan: doc/fuzzing.md (20 jurnal/paper)"

[lib]
name = "mivon_fuzz"
path = "src/lib.rs"

[[bin]]
name = "mivon-fuzz"
path = "src/main.rs"
required-features = ["dev"]

[features]
# Fitur `dev`: seluruh isi crate (lib) HANYA aktif saat feature ini diaktifkan.
# `cargo build` di workspace default = crate kosong (tidak menarik mivon-api).
# `cargo run -p mivon-fuzz --features dev` / `cargo test -p mivon-fuzz --features dev`.
dev = [
    "dep:mivon-api",
    "dep:mivon-ir",
    "dep:mivon-parser",
    "dep:rand",
    "dep:serde",
]

[dependencies]
mivon-api = { path = "../mivon-api", optional = true }
mivon-ir = { path = "../mivon-ir", optional = true }
mivon-parser = { path = "../mivon-parser", optional = true }
rand = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"], optional = true }