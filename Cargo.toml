[workspace]
# src-tauri dipindah ke legacy/ (digantikan GUI egui di src/gui/)
resolver = "2"

[package]
name = "maria"
version = "0.3.0"
edition = "2021"
description = "RTL Simulator untuk SystemVerilog - dibangun dengan Rust"

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rayon = "1"
thiserror = "2"
wavefst = { version = "0.1", default-features = false, features = ["gzip"] }

# ── Fase 0: Foundation ──
dashmap = "6"
crossbeam = "0.8"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
mimalloc = { version = "0.1", features = ["secure"] }
memmap2 = "0.9"

# ── Utility ──
num_cpus = "1"
walkdir = "2"
fxhash = "0.2"
thread_local = "1"
parking_lot = "0.12"
itertools = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Opsional: JIT Compilation (cranelift) ──
cranelift = { version = "0.110", optional = true }
cranelift-jit = { version = "0.110", optional = true }
cranelift-frontend = { version = "0.110", optional = true }
cranelift-module = { version = "0.110", optional = true }

# ── Opsional: DPI-C FFI ──
libloading = { version = "0.8", optional = true }

# ── Opsional: LSP Server ──
tower-lsp = { version = "0.20", optional = true }
lsp-types = { version = "0.94", optional = true }
url = { version = "2", optional = true }
tokio = { version = "1", features = ["full"], optional = true }

# ── Opsional: Formal Verification (Z3 SMT) ──
z3 = { version = "0.20", optional = true }

# ── Opsional: GUI native (egui) — pengganti Tauri ──
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
egui_code_editor = { version = "0.3", optional = true }
rfd = { version = "0.17", optional = true }

[features]
# Semua fitur diaktifkan secara default
# Untuk build minimal: cargo build --no-default-features
default = ["lsp", "jit", "formal", "dpi"]

# LSP server (tower-lsp + tokio) — IDE integration via --lsp flag
lsp = ["tower-lsp", "lsp-types", "url", "tokio"]

# Cranelift JIT — compiled-code simulation (expression + body level)
jit = ["cranelift", "cranelift-jit", "cranelift-frontend", "cranelift-module"]

# Formal verification (Z3 SMT solver + BMC engine)
formal = ["z3"]

# DPI-C foreign language interface
dpi = ["libloading"]

# Native GUI (egui) — menggantikan frontend Tauri/React
gui = ["dep:eframe", "dep:egui_code_editor", "dep:rfd"]

[[bin]]
name = "maria-gui"
path = "src/bin/maria_gui.rs"
required-features = ["gui"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
