[workspace]
# src-tauri dipindah ke legacy/ (digantikan GUI egui di src/gui/)
# Migrasi monorepo: logika dipindah bertahap dari src/ ke crates/.
resolver = "2"
members = [
    "crates/maria-core",
    "crates/maria-ast",
    "crates/maria-ir",
    "crates/maria-parser",
    "crates/maria-elaboration",
    "crates/maria-compiler",
    "crates/maria-simulator",
    "crates/maria-mv",
    "crates/maria-formal",
    "crates/maria-sir",
    "crates/maria-netlist",
    "crates/maria-tech",
    "crates/maria-synth",
    "crates/maria-env",
    "crates/maria-tools",
    "crates/maria-gui",
    "crates/maria-api",
    "crates/maria-tests",
]

[package]
name = "maria"
version = "0.3.0"
edition = "2021"
description = "RTL Simulator untuk SystemVerilog - dibangun dengan Rust"
default-run = "maria"

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rayon = "1"
thiserror = "2"
# MICD: binary serialization AST per file (persistent incremental compile)
bincode = "1.3"
# MICD: kompresi LZ4 untuk blob AST/verify (Kritik 15 db.md)
lz4_flex = { version = "0.11", default-features = false, features = ["frame"] }
wavefst = { version = "0.1", default-features = false, features = ["gzip"] }

# ── Fase 0: Foundation ──
dashmap = "6"
crossbeam = "0.8"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
mimalloc = { version = "0.1", features = ["secure"] }
memmap2 = "0.9"

# ── Utility ──
num_cpus = "1"
walkdir = "2"
fxhash = "0.2"
thread_local = "1"
parking_lot = "0.12"
itertools = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Config file TOML (configs/*.toml — compiler/simulasi/coverage/debug)
toml = "0.8"

# ── Workspace crates (migrasi monorepo: src/ → crates/) ──
maria-core = { path = "crates/maria-core" }
maria-ast = { path = "crates/maria-ast" }
maria-ir = { path = "crates/maria-ir" }
maria-parser = { path = "crates/maria-parser" }
maria-elaboration = { path = "crates/maria-elaboration" }
maria-compiler = { path = "crates/maria-compiler" }
maria-simulator = { path = "crates/maria-simulator" }
maria-mv = { path = "crates/maria-mv" }
maria-sir = { path = "crates/maria-sir" }
maria-tech = { path = "crates/maria-tech" }
maria-synth = { path = "crates/maria-synth" }
maria-env = { path = "crates/maria-env" }
maria-tools = { path = "crates/maria-tools" }
maria-api = { path = "crates/maria-api" }

# ── Opsional: JIT Compilation (cranelift) ──
cranelift = { version = "0.110", optional = true }
cranelift-jit = { version = "0.110", optional = true }
cranelift-frontend = { version = "0.110", optional = true }
cranelift-module = { version = "0.110", optional = true }

# ── Opsional: DPI-C FFI ──
libloading = { version = "0.8", optional = true }

# ── Opsional: LSP Server — tower-lsp/lsp-types kini di maria-env ──
# tokio tetap di root: main.rs membuat Runtime untuk LSP (cfg feature lsp).
tokio = { version = "1", features = ["full"], optional = true }

# ── Opsional: Formal Verification (Z3 SMT) — z3 kini di maria-formal ──

# ── Opsional: GUI native (egui) — eframe/egui/rfd kini di maria-gui ──
# Backend rendering: wgpu (GPU/Vulkan) utama + glow (OpenGL) fallback.
# Crate maria-gui mengelola deps GUI; root hanya wiring feature gui.

[features]
# Semua fitur diaktifkan secara default
# Untuk build minimal: cargo build --no-default-features
default = ["lsp", "jit", "formal", "dpi"]

# LSP server — re-export di maria-api; tokio untuk Runtime di main.rs
lsp = ["maria-api/lsp", "tokio"]

# Cranelift JIT — compiled-code simulation (expression + body level)
jit = ["cranelift", "cranelift-jit", "cranelift-frontend", "cranelift-module", "maria-simulator/jit"]

# Formal verification (Z3 SMT solver + BMC engine) — di maria-api
formal = ["maria-api/formal"]

# DPI-C foreign language interface
dpi = ["libloading", "maria-simulator/dpi", "maria-env/dpi"]

# Native GUI (egui) — re-export di maria-api; binary `maria-gui` di crate maria-gui
gui = ["maria-api/gui"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
