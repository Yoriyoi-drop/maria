# ==================================================
# Maria Simulation Configuration (Limited — timeout)
# ==================================================
# Mode simulasi dengan batas waktu eksplisit (untuk smoke test / CI).
# Pakai: maria --config configs/simulation-limited.toml -f proyek.f

[compiler]
edition = "2012"
target = "native"
jobs = 8
incremental = true
opt_level = 2
lto = "off"
max_parse_steps = 10000000
cache = true
fail_fast = true

[elaborate]
mode = "StrictSimulation"
expand_all_generates = true
unroll_const_loops = true

[simulation]
# Batas keras waktu simulasi (ns). null = unlimited.
max_time = 1000000
force_sim = false
watchdog_idle_seconds = 5
progress_every_ticks = 100000
max_delta_per_step = 10000000

[waveform]
vcd = true
fst = false
stream = false
